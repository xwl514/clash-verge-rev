name: Package Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - feat/domain-traffic-statistics
    paths:
      - .github/workflows/package-windows.yml
      - src/**
      - src-tauri/**
      - crates/**
      - scripts/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vite.config.mts

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: windows-x64-installer

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled cores and service
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Identify the custom build
        shell: pwsh
        run: |
          $baseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('+')[0]
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          pnpm release-version "$baseVersion+domainstats.$shortSha"

      - name: Build Windows installer
        shell: pwsh
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'package-windows.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' |
            Set-Content -LiteralPath $configPath -Encoding utf8
          pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --config $configPath -- --locked

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $bundleDir = 'target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter '*-setup.exe')
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          $installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath "$bundleDir/SHA256SUMS.txt" -Encoding utf8
          "Source commit: $env:GITHUB_SHA" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-Content "$bundleDir/SHA256SUMS.txt" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Clash-Verge-domain-statistics-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
